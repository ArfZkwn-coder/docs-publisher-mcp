# Hosted docs-publisher connector for claude.ai custom connectors.
# Settings live in .env (copy .env.example). Start or update with:
#   docker compose up -d --build
services:
  docs-publisher:
    build: .
    image: docs-publisher:local
    container_name: docs-publisher
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8787"
      SITE_DIR: /data/site
    ports:
      - "8787:8787"
      # Admin API for n8n: Docker bridge address only, never public.
      - "172.17.0.1:8788:8788"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 3m
      retries: 3
